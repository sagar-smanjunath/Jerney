# ==============================================================
# Jerney 3-Tier Blog Application - Kubernetes Manifest
#
# Architecture:
#
# Internet
#    |
#    v
# AWS ALB / EKS Auto Mode Ingress
#    |
#    v
# Frontend Service :80
#    |
#    v
# React + Nginx :8080
#    |
#    +---- /       -> React static files
#    |
#    +---- /api/   -> jerney-backend:5000
#                         |
#                         v
#                    Node.js Backend
#                         |
#                         v
#                    PostgreSQL
#                         |
#                         v
#                      PVC -> EBS
#
# Container images are built by Jenkins and pushed to Docker Hub.
#
# Kubeaudit is run by Jenkins against this manifest.
# ==============================================================


# --------------------------------------------------------------
# 1. Namespace
# --------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: jerney
  labels:
    app.kubernetes.io/part-of: jerney

---
# --------------------------------------------------------------
# 2. PostgreSQL Secret
#
# These are currently demo credentials for this standalone project.
# Later we can move them to a proper secret-management solution.
# --------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: jerney-db-secret
  namespace: jerney
  labels:
    app.kubernetes.io/part-of: jerney
    app.kubernetes.io/component: database
type: Opaque
data:
  POSTGRES_USER: amVybmV5X3VzZXI=
  POSTGRES_PASSWORD: amVybmV5X3Bhc3NfMjAyNg==
  POSTGRES_DB: amVybmV5X2Ri

---
# --------------------------------------------------------------
# 3. EBS StorageClass - EKS Auto Mode
# --------------------------------------------------------------
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: jerney-ebs-sc
  labels:
    app.kubernetes.io/part-of: jerney
provisioner: ebs.csi.eks.amazonaws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
allowedTopologies:
  - matchLabelExpressions:
      - key: eks.amazonaws.com/compute-type
        values:
          - auto

---
# --------------------------------------------------------------
# 4. PostgreSQL PersistentVolumeClaim
# --------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jerney-db-pvc
  namespace: jerney
  labels:
    app.kubernetes.io/part-of: jerney
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: jerney-ebs-sc
  resources:
    requests:
      storage: 10Gi

---
# --------------------------------------------------------------
# 5. PostgreSQL Deployment
# --------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jerney-db
  namespace: jerney
  labels:
    app.kubernetes.io/name: jerney-db
    app.kubernetes.io/part-of: jerney
    app.kubernetes.io/component: database

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: jerney-db

  template:
    metadata:
      labels:
        app.kubernetes.io/name: jerney-db
        app.kubernetes.io/part-of: jerney
        app.kubernetes.io/component: database

    spec:
      automountServiceAccountToken: false

      nodeSelector:
        eks.amazonaws.com/compute-type: auto

      containers:

        - name: postgres

          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5432
              protocol: TCP

          envFrom:
            - secretRef:
                name: jerney-db-secret

          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/postgresql/data
              subPath: pgdata

          resources:

            requests:
              cpu: 250m
              memory: 256Mi

            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false

          livenessProbe:

            exec:
              command:
                - pg_isready
                - -U
                - jerney_user
                - -d
                - jerney_db

            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:

            exec:
              command:
                - pg_isready
                - -U
                - jerney_user
                - -d
                - jerney_db

            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:

        - name: db-storage

          persistentVolumeClaim:
            claimName: jerney-db-pvc

---
# --------------------------------------------------------------
# 6. PostgreSQL Service
# Internal access only
# --------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: jerney-db
  namespace: jerney
  labels:
    app.kubernetes.io/name: jerney-db
    app.kubernetes.io/part-of: jerney
    app.kubernetes.io/component: database

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: jerney-db

  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP

---
# --------------------------------------------------------------
# 7. Backend Deployment
# --------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jerney-backend
  namespace: jerney
  labels:
    app.kubernetes.io/name: jerney-backend
    app.kubernetes.io/part-of: jerney
    app.kubernetes.io/component: backend

spec:
  replicas: 2

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  minReadySeconds: 10
  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app.kubernetes.io/name: jerney-backend

  template:
    metadata:
      labels:
        app.kubernetes.io/name: jerney-backend
        app.kubernetes.io/part-of: jerney
        app.kubernetes.io/component: backend

    spec:
      automountServiceAccountToken: false

      nodeSelector:
        eks.amazonaws.com/compute-type: auto

      initContainers:

        - name: wait-for-db

          image: busybox:1.36
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532

            capabilities:
              drop:
                - ALL

          command:
            - sh
            - -c
            - |
              echo "Waiting for jerney-db:5432..."

              until nc -z jerney-db 5432; do
                echo "DB not ready, retrying in 3s..."
                sleep 3
              done

              echo "DB is ready!"

      containers:

        - name: backend

          image: sagarsmanjunath/jerney-backend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 5000
              protocol: TCP

          env:

            - name: PORT
              value: "5000"

            - name: DB_HOST
              value: "jerney-db"

            - name: DB_PORT
              value: "5432"

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: jerney-db-secret
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jerney-db-secret
                  key: POSTGRES_PASSWORD

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: jerney-db-secret
                  key: POSTGRES_DB

          resources:

            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 300m
              memory: 256Mi

          securityContext:

            allowPrivilegeEscalation: false

            readOnlyRootFilesystem: true

            runAsNonRoot: true

            runAsUser: 1000

            capabilities:
              drop:
                - ALL

          volumeMounts:

            - name: tmp
              mountPath: /tmp

          livenessProbe:

            httpGet:
              path: /api/health
              port: 5000

            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:

            httpGet:
              path: /api/health
              port: 5000

            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:

        - name: tmp
          emptyDir: {}

---
# --------------------------------------------------------------
# 8. Backend Service
# Internal access only
# --------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: jerney-backend
  namespace: jerney
  labels:
    app.kubernetes.io/name: jerney-backend
    app.kubernetes.io/part-of: jerney
    app.kubernetes.io/component: backend

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: jerney-backend

  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP

---
# --------------------------------------------------------------
# 9. Frontend Deployment
#
# Nginx listens on 8080.
#
# Nginx configuration:
#
# /       -> React static files
# /api/   -> jerney-backend:5000
# --------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jerney-frontend
  namespace: jerney
  labels:
    app.kubernetes.io/name: jerney-frontend
    app.kubernetes.io/part-of: jerney
    app.kubernetes.io/component: frontend

spec:
  replicas: 2

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  minReadySeconds: 10
  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app.kubernetes.io/name: jerney-frontend

  template:

    metadata:
      labels:
        app.kubernetes.io/name: jerney-frontend
        app.kubernetes.io/part-of: jerney
        app.kubernetes.io/component: frontend

    spec:

      automountServiceAccountToken: false

      nodeSelector:
        eks.amazonaws.com/compute-type: auto

      containers:

        - name: frontend

          image: sagarsmanjunath/jerney-frontend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8080
              protocol: TCP

          resources:

            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 200m
              memory: 128Mi

          securityContext:

            allowPrivilegeEscalation: false

            runAsNonRoot: true

            runAsUser: 101

            capabilities:
              drop:
                - ALL

          livenessProbe:

            httpGet:
              path: /
              port: 8080

            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:

            httpGet:
              path: /
              port: 8080

            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3

---
# --------------------------------------------------------------
# 10. Frontend Service
#
# Service port 80
#       |
#       v
# Container port 8080
# --------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: jerney-frontend
  namespace: jerney
  labels:
    app.kubernetes.io/name: jerney-frontend
    app.kubernetes.io/part-of: jerney
    app.kubernetes.io/component: frontend

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: jerney-frontend

  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP

---
# --------------------------------------------------------------
# 11. EKS Auto Mode IngressClassParams
# --------------------------------------------------------------
apiVersion: eks.amazonaws.com/v1
kind: IngressClassParams
metadata:
  name: jerney-alb
  labels:
    app.kubernetes.io/part-of: jerney

spec:
  scheme: internet-facing

---
# --------------------------------------------------------------
# 12. EKS Auto Mode IngressClass
# --------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: jerney-alb
  labels:
    app.kubernetes.io/part-of: jerney

spec:
  controller: eks.amazonaws.com/alb

  parameters:
    apiGroup: eks.amazonaws.com
    kind: IngressClassParams
    name: jerney-alb

---
# --------------------------------------------------------------
# 13. AWS ALB Ingress
#
# ALB sends all traffic to the frontend Service.
#
# Nginx then handles:
#
# /       -> React
# /api/   -> Node.js backend
# --------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jerney-ingress
  namespace: jerney
  labels:
    app.kubernetes.io/part-of: jerney

  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

spec:

  ingressClassName: jerney-alb

  rules:

    - http:

        paths:

          - path: /
            pathType: Prefix

            backend:

              service:
                name: jerney-frontend
                port:
                  number: 80

---
# --------------------------------------------------------------
# 14. Backend HPA
#
# Minimum: 2 replicas
# Maximum: 5 replicas
# --------------------------------------------------------------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jerney-backend-hpa
  namespace: jerney

  labels:
    app.kubernetes.io/name: jerney-backend
    app.kubernetes.io/part-of: jerney

spec:

  scaleTargetRef:

    apiVersion: apps/v1
    kind: Deployment
    name: jerney-backend

  minReplicas: 2
  maxReplicas: 5

  behavior:

    scaleUp:

      stabilizationWindowSeconds: 0

      policies:

        - type: Percent
          value: 100
          periodSeconds: 60

    scaleDown:

      stabilizationWindowSeconds: 300

      policies:

        - type: Percent
          value: 50
          periodSeconds: 60

  metrics:

    - type: Resource

      resource:

        name: cpu

        target:

          type: Utilization
          averageUtilization: 70

    - type: Resource

      resource:

        name: memory

        target:

          type: Utilization
          averageUtilization: 75

---
# --------------------------------------------------------------
# 15. Frontend HPA
#
# Minimum: 2 replicas
# Maximum: 4 replicas
# --------------------------------------------------------------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jerney-frontend-hpa
  namespace: jerney

  labels:
    app.kubernetes.io/name: jerney-frontend
    app.kubernetes.io/part-of: jerney

spec:

  scaleTargetRef:

    apiVersion: apps/v1
    kind: Deployment
    name: jerney-frontend

  minReplicas: 2
  maxReplicas: 4

  behavior:

    scaleUp:

      stabilizationWindowSeconds: 0

      policies:

        - type: Percent
          value: 100
          periodSeconds: 60

    scaleDown:

      stabilizationWindowSeconds: 300

      policies:

        - type: Percent
          value: 50
          periodSeconds: 60

  metrics:

    - type: Resource

      resource:

        name: cpu

        target:

          type: Utilization
          averageUtilization: 70

    - type: Resource

      resource:

        name: memory

        target:

          type: Utilization
          averageUtilization: 75

---
# --------------------------------------------------------------
# 16. Backend PodDisruptionBudget
# --------------------------------------------------------------
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: jerney-backend-pdb
  namespace: jerney

  labels:
    app.kubernetes.io/part-of: jerney

spec:

  minAvailable: 1

  selector:

    matchLabels:
      app.kubernetes.io/name: jerney-backend

---
# --------------------------------------------------------------
# 17. Frontend PodDisruptionBudget
# --------------------------------------------------------------
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: jerney-frontend-pdb
  namespace: jerney

  labels:
    app.kubernetes.io/part-of: jerney

spec:

  minAvailable: 1

  selector:

    matchLabels:
      app.kubernetes.io/name: jerney-frontend

---
# --------------------------------------------------------------
# 18. NetworkPolicy
#
# PostgreSQL accepts traffic ONLY from backend pods.
# --------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jerney-db-allow-backend-only
  namespace: jerney

spec:

  podSelector:

    matchLabels:
      app.kubernetes.io/name: jerney-db

  policyTypes:
    - Ingress

  ingress:

    - from:

        - podSelector:

            matchLabels:
              app.kubernetes.io/name: jerney-backend

      ports:

        - port: 5432
          protocol: TCP

---
# --------------------------------------------------------------
# 19. NetworkPolicy
#
# Backend accepts traffic ONLY from frontend pods.
#
# Nginx runs inside the frontend pod and proxies:
#
# /api/ -> jerney-backend:5000
# --------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jerney-backend-allow-frontend-only
  namespace: jerney

spec:

  podSelector:

    matchLabels:
      app.kubernetes.io/name: jerney-backend

  policyTypes:
    - Ingress

  ingress:

    - from:

        - podSelector:

            matchLabels:
              app.kubernetes.io/name: jerney-frontend

      ports:

        - port: 5000
          protocol: TCP
          
